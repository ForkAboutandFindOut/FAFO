    <script>
      (function () {
        async function checkGate() {
          try {
            const res = await fetch("/api/gate", { credentials: "include" });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.ok) {
              localStorage.setItem("fafo_access", "1");
              return true;
            }
          } catch (e) {}
          return false;
        }

        try {
          if (!localStorage.getItem("fafo_access")) {
            checkGate().then((ok) => {
              if (!ok) {
                const next = encodeURIComponent(location.pathname + location.search);
                location.replace(`/login/?next=${next}`);
              }
            });
          }
        } catch (e) {
          checkGate().then((ok) => {
            if (!ok) {
              const next = encodeURIComponent(location.pathname + location.search);
              location.replace(`/login/?next=${next}`);
            }
          });
        }
      })();
</script>

    <script>
      const tooltip = document.getElementById("episodeTooltip");
      const tooltipTitle = document.getElementById("episodeTooltipTitle");
      const tooltipDesc = document.getElementById("episodeTooltipDesc");
      const tooltipLink = document.getElementById("episodeTooltipLink");
      const cards = Array.from(document.querySelectorAll("[data-episode]"));

      function setTooltipContent(card) {
        tooltipTitle.textContent = card.dataset.title || "";
        tooltipDesc.textContent = card.dataset.desc || "";
        tooltipLink.href = card.dataset.download || "#";
      }

      function positionTooltip(e) {
        const offset = 14;
        const x = e.clientX + offset;
        const y = e.clientY + offset;
        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
      }

      const isTouch = window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;

      if (!isTouch) {
        cards.forEach((card) => {
          card.addEventListener("mouseenter", (e) => {
            setTooltipContent(card);
            positionTooltip(e);
            tooltip.classList.add("show");
            tooltip.setAttribute("aria-hidden", "false");
          });

          card.addEventListener("mousemove", positionTooltip);

          card.addEventListener("mouseleave", () => {
            tooltip.classList.remove("show");
            tooltip.setAttribute("aria-hidden", "true");
          });
        });
      }

      function fillDetails(card) {
        const details = card.querySelector(".episode-details");
        if (!details) return;
        const title = card.dataset.title || "";
        const desc = card.dataset.desc || "";
        const download = card.dataset.download || "#";
        details.innerHTML = `
          <div><strong>${title}</strong></div>
          <div>${desc}</div>
          <div><strong>Click to download the MP3 🍴</strong></div>
        `;
        if (download && download !== "#") {
          details.innerHTML = `
            <div><strong>${title}</strong></div>
            <div>${desc}</div>
            <div><a href="${download}" download><strong>Click to download the MP3 🍴</strong></a></div>
          `;
        }
      }

      if (isTouch) {
        cards.forEach((card) => fillDetails(card));
      }
    </script>
