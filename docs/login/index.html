<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fork About &amp; Find Out — Access</title>

    <style>
      :root{
        --w98-bg: #008080;          /* Win98 teal desktop */
        --w98-face: #c0c0c0;        /* window face */
        --w98-shadow: #808080;      /* dark bevel */
        --w98-deep:   #404040;      /* deeper shadow */
        --w98-hilite: #ffffff;      /* light bevel */
        --w98-text: #000000;
        --w98-title: #000080;       /* titlebar navy */
        --w98-title-text: #ffffff;
      }

      html, body { height: 100%; }

      body{
        margin: 0;
        background: var(--w98-bg);
        color: var(--w98-text);
        font-family: "MS Sans Serif", Tahoma, Verdana, Arial, sans-serif;
        cursor: url("/assets/cursor.png") 0 0, auto;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: auto;
        text-rendering: geometricPrecision;
      }

      *{
        cursor: url("/assets/cursor.png") 0 0, auto;
      }

      .desktop{
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      /* --- Win98 dialog --- */
      .dialog{
        width: min(480px, 100%);
        background: var(--w98-face);
        border: 2px solid var(--w98-hilite);
        box-shadow:
          inset -2px -2px 0 var(--w98-shadow),
          inset  2px  2px 0 var(--w98-hilite),
          2px 2px 0 #000;
      }

      .titlebar{
        background: var(--w98-title);
        height: 22px;
        user-select: none;
      }

      .dialog-body{
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 16px;
        padding: 18px 16px 14px;
      }

      .spin-logo{
        width: 96px;
        height: 96px;
        display: block;
        background: transparent;
      }

      .fields{
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .prompt{
        margin: 0 0 6px;
        font-size: 13px;
        line-height: 1.35;
        color: #000;
      }

      .row{
        display: grid;
        grid-template-columns: 92px 1fr;
        align-items: center;
        gap: 8px;
      }

      .row-label{
        font-size: 13px;
        color: #000;
        text-align: left;
      }

      .row-value{
        font-size: 13px;
        font-family: "Courier New", monospace;
        font-weight: 700;
      }

      .row input[type="text"],
      .row input[type="email"]{
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        font-size: 14px;
        font-family: "MS Sans Serif", Tahoma, Verdana, Arial, sans-serif;
        background: #ffffff;
        border: 2px solid var(--w98-shadow);
        box-shadow:
          inset 1px 1px 0 var(--w98-deep),
          inset -1px -1px 0 var(--w98-hilite);
        outline: none;
      }

      .row input:focus{
        outline: 1px dotted #000;
        outline-offset: -3px;
      }

      .checkrow{
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        font-size: 13px;
        color: #000;
      }

      .checkrow input[type="checkbox"]{
        width: 18px;
        height: 18px;
        margin: 0;
        flex: 0 0 auto;
        accent-color: #000080;
      }

      .checkrow-label{
        font-size: 13px;
        line-height: 1.3;
        user-select: none;
      }

      .emoji-outline{
        text-shadow:
          -1px -1px 0 #000,
           1px -1px 0 #000,
          -1px  1px 0 #000,
           1px  1px 0 #000,
           0px -1px 0 #000,
           0px  1px 0 #000,
          -1px  0px 0 #000,
           1px  0px 0 #000;
      }

      #msg{
        margin: 6px 0 0;
        min-height: 14px;
        font-size: 12px;
        line-height: 1.3;
      }
      .err{ color: #b00020; }
      .ok{ color: #0a7a0a; }

      .actions{
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }

      .dialog-btn{
        min-width: 76px;
        padding: 4px 12px;
        font-size: 13px;
        font-family: "MS Sans Serif", Tahoma, Verdana, Arial, sans-serif;
        background: var(--w98-face);
        color: #000;
        border: 1px solid #000;
        box-shadow:
          inset -1px -1px 0 var(--w98-shadow),
          inset  1px  1px 0 var(--w98-hilite),
          inset -2px -2px 0 var(--w98-deep),
          inset  2px  2px 0 var(--w98-face);
        cursor: url("/assets/cursor.png") 0 0, auto;
      }

      .dialog-btn:active{
        box-shadow:
          inset 1px 1px 0 var(--w98-shadow),
          inset -1px -1px 0 var(--w98-hilite),
          inset 2px 2px 0 var(--w98-deep),
          inset -2px -2px 0 var(--w98-face);
      }

      .dialog-btn:focus{
        outline: 1px dotted #000;
        outline-offset: -4px;
      }

      .dialog-btn:disabled{
        opacity: 0.65;
        cursor: not-allowed;
      }

      /* --- Responsive: stack icon above on narrow screens --- */
      @media (max-width: 480px){
        .dialog-body{
          grid-template-columns: 1fr;
          justify-items: start;
        }
        .spin-logo{ margin: 0 auto; }
        .row{ grid-template-columns: 80px 1fr; }
      }

      /* --- Boot / POST screen (wow-factor B) --- */
      @font-face{
        font-family: "Pixel Operator 8";
        src: url("/assets/PixelOperator8.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block; /* wait for the pixel font before typing starts */
      }

      .boot-screen{
        position: fixed;
        inset: 0;
        background: #000;
        color: #f5f5f5;
        font-family: "Pixel Operator 8", "Courier New", monospace;
        font-size: 16px;
        line-height: 1.6;
        padding: 24px 28px;
        white-space: pre;
        overflow: hidden;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms linear;
        cursor: none;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }
      .boot-screen div{
        /* Fake bold without faux-bolding the pixel font: offset a 1px copy. */
        text-shadow: 1px 0 0 currentColor;
      }
      .boot-screen.show{
        opacity: 1;
        pointer-events: auto;
      }
      .boot-screen *{ cursor: none; }
      .boot-screen div:empty::before{ content: "\00a0"; }
      .boot-cursor{
        display: inline-block;
        width: 0.6em;
        height: 1em;
        background: #f5f5f5;
        vertical-align: -2px;
        animation: boot-blink 1s steps(2, start) infinite;
      }
      @keyframes boot-blink{
        to { visibility: hidden; }
      }
    </style>
  </head>

  <body>
    <div class="desktop">
      <div class="dialog" role="dialog" aria-describedby="dialogPrompt">
        <div class="titlebar"></div>

        <div class="dialog-body">
          <video
            class="spin-logo"
            autoplay
            loop
            muted
            playsinline
            aria-hidden="true"
          >
            <source src="/assets/fafo-spin.webm" type="video/webm" />
            <source src="/assets/fafo-spin.mp4" type="video/mp4" />
          </video>

          <div class="fields">
            <p class="prompt" id="dialogPrompt">
              You must supply your details to access the full interviews
            </p>

            <div class="row">
              <span class="row-label">Resource:</span>
              <span class="row-value">\\FAFO\GUEST</span>
            </div>

            <form id="f" autocomplete="on">
              <div class="row">
                <label for="firstName" class="row-label">First name:</label>
                <input
                  id="firstName"
                  name="firstName"
                  type="text"
                  autocomplete="given-name"
                  required
                />
              </div>

              <div class="row" style="margin-top: 8px;">
                <label for="lastName" class="row-label">Last name:</label>
                <input
                  id="lastName"
                  name="lastName"
                  type="text"
                  autocomplete="family-name"
                  required
                />
              </div>

              <div class="row" style="margin-top: 8px;">
                <label for="email" class="row-label">Email:</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="checkrow">
                <input id="updates" name="updates" type="checkbox" />
                <span class="checkrow-label">Add me to the FAFO mailing list <span class="emoji-outline">🍴</span></span>
              </div>

              <p id="msg" aria-live="polite"></p>

              <div class="actions">
                <button id="btn" type="submit" class="dialog-btn">OK</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="boot" class="boot-screen" aria-hidden="true"></div>

    <script>
      // Skip login if the gate cookie is already valid for this browser
      (function () {
        async function checkGate() {
          try {
            const res = await fetch("/api/gate", { credentials: "include" });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.ok) {
              localStorage.setItem("fafo_access", "1");
              const params = new URLSearchParams(window.location.search);
              const next = params.get("next") || "/";
              window.location.assign(next);
              return true;
            }
          } catch (e) {}
          return false;
        }
        try { checkGate(); } catch (e) {}
      })();

      const f = document.getElementById("f");
      const firstNameEl = document.getElementById("firstName");
      const lastNameEl = document.getElementById("lastName");
      const emailEl = document.getElementById("email");
      const updatesEl = document.getElementById("updates");
      const msg = document.getElementById("msg");
      const btn = document.getElementById("btn");

      // Make the entire checkbox row clickable so the small checkbox is easier to tick.
      // Clicks on the checkbox itself fall through to native behaviour; clicks anywhere
      // else on the row toggle it programmatically.
      const checkrow = document.querySelector(".checkrow");
      if (checkrow) {
        checkrow.addEventListener("click", (e) => {
          if (e.target !== updatesEl) {
            updatesEl.checked = !updatesEl.checked;
            updatesEl.dispatchEvent(new Event("change", { bubbles: true }));
          }
        });
      }

      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || "/";

      function setMsg(text, type) {
        msg.textContent = text || "";
        msg.className = type ? type : "";
      }

      // Wow-factor B: BIOS/POST overlay shown once between login success and redirect.
      // Returning visitors are redirected by the checkGate() IIFE above and never see this.
      // Types each line character-by-character; a blinking cursor follows the typing
      // position and parks on the final "Loading desktop" line until navigation cuts.
      async function runBootSequence(firstName) {
        const boot = document.getElementById("boot");
        if (!boot) return;

        const name = (firstName || "guest").slice(0, 40);
        const cols = 52; // padded width for dotted leaders
        const pad = (label, status) => {
          const dots = ".".repeat(Math.max(3, cols - label.length - status.length));
          return label + " " + dots + " " + status;
        };

        // cps = characters per second. Higher = faster typing.
        // POST status lines stream fast (real BIOS feel); welcome + loading
        // slow down to land with weight.
        const lines = [
          { text: "FAFO BIOS v1.0",                        cps: 30, gapAfter: 200 },
          { text: pad("Memory check", "640K OK"),          cps: 90, gapAfter: 80  },
          { text: pad("Verifying gate cookie", "OK"),      cps: 90, gapAfter: 80  },
          { text: pad("Establishing session", "OK"),       cps: 90, gapAfter: 200 },
          { text: "",                                                 gapAfter: 100 },
          { text: "Welcome, " + name + ".",                cps: 35, gapAfter: 300 },
          { text: "",                                                 gapAfter: 100 },
          { text: "Loading desktop",                       cps: 40, gapAfter: 400, leaveCursor: true },
        ];

        boot.textContent = "";
        boot.classList.add("show");

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        // requestAnimationFrame-based typing: setTimeout per char gets clamped
        // to ~16ms+ on most browsers (esp. after a few nested timeouts), which
        // would stretch a 4-second sequence to 15+ seconds. rAF runs at the
        // display's refresh rate (typically 60fps) and we add as many chars per
        // frame as the requested cps requires.
        const typeText = (div, cursor, text, cps) => new Promise((resolve) => {
          if (!text) return resolve();
          const totalMs = (text.length / cps) * 1000;
          let start = null;
          let shown = 0;
          const tick = (now) => {
            if (start === null) start = now;
            const progress = Math.min(1, (now - start) / totalMs);
            const target = Math.floor(progress * text.length);
            while (shown < target) {
              div.insertBefore(document.createTextNode(text[shown]), cursor);
              shown++;
            }
            if (shown < text.length) requestAnimationFrame(tick);
            else resolve();
          };
          requestAnimationFrame(tick);
        });

        let activeCursor = null;
        for (const line of lines) {
          const div = document.createElement("div");
          boot.appendChild(div);

          // Move/remove any cursor from the previous line.
          if (activeCursor) { activeCursor.remove(); activeCursor = null; }

          if (line.text) {
            // Cursor lives at the end of the current line; chars are inserted before it.
            const cur = document.createElement("span");
            cur.className = "boot-cursor";
            div.appendChild(cur);
            activeCursor = cur;

            await typeText(div, cur, line.text, line.cps);
          }

          if (!line.leaveCursor && activeCursor) {
            activeCursor.remove();
            activeCursor = null;
          }

          if (line.gapAfter) await sleep(line.gapAfter);
        }
        // No fade-out: cut straight from boot to the next page so the user
        // never glimpses the login dialog underneath during the transition.
      }

      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg("Connecting…", "");
        btn.disabled = true;

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);

        try {
          const firstName = firstNameEl.value.trim();
          const lastName = lastNameEl.value.trim();
          const fullName = [firstName, lastName].filter(Boolean).join(" ");

          const payload = {
            name: fullName,
            email: emailEl.value.trim(),
            marketing_opt_in: !!updatesEl?.checked,
            consent_version: "login_updates_v1",
          };

          const res = await fetch("/api/subscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            signal: controller.signal,
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.ok) {
            const err = data.error || data.details || "Something went wrong.";
            setMsg(err, "err");
            return;
          }

          setMsg("Access granted.", "ok");
          localStorage.setItem("fafo_access", "1");
          await runBootSequence(firstName);
          window.location.assign(next);
        } catch (err) {
          console.error(err);
          const isAbort = err && err.name === "AbortError";
          setMsg(isAbort ? "Request timed out. Try again." : "Network/JS error. Check console.", "err");
        } finally {
          clearTimeout(timeout);
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
