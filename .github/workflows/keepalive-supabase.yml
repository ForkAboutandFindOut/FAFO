name: Keep Supabase awake

# Supabase free-tier projects pause after ~1 week of inactivity, which breaks
# /api/subscribe (see CLAUDE.md "Supabase free-tier auto-pause"). This job
# pings the REST API on a schedule so the project stays marked active.
#
# Required GitHub Actions secrets:
#   SUPABASE_URL                — same value as the Cloudflare Pages env var
#   SUPABASE_SERVICE_ROLE_KEY   — same value as the Cloudflare Pages env var
# Add them at: Settings → Secrets and variables → Actions.

on:
  schedule:
    # Every 3 days at 12:00 UTC. Cron's "*/N day-of-month" syntax resets at
    # month boundaries, so the worst-case gap is ~4 days — still well under
    # the ~7-day pause threshold.
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi
          # Service role key bypasses RLS so the ping works regardless of
          # policies on mailing_list. Read a single row to minimise side effects.
          curl -fsS \
            "${SUPABASE_URL%/}/rest/v1/mailing_list?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            > /dev/null
          echo "OK: Supabase responded"
